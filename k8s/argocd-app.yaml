apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cadence
  namespace: argocd
  annotations:
    # ArgoCD Image Updater — polls GHCR and bumps the tag automatically.
    # Remove the update-gitops job from the CI workflow when using this.
    argocd-image-updater.argoproj.io/image-list: cadence=ghcr.io/sentient-soup/cadence
    argocd-image-updater.argoproj.io/cadence.update-strategy: latest
    argocd-image-updater.argoproj.io/cadence.kustomize.image-name: ghcr.io/sentient-soup/cadence
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/sentient-soup/gitops   # ← change to your gitops repo
    targetRevision: HEAD
    path: apps/cadence
  destination:
    server: https://kubernetes.default.svc
    namespace: cadence
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
