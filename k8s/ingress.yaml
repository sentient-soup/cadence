apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadence
  namespace: cadence
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: cadence.example.com   # ← replace with your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cadence
                port:
                  number: 80
